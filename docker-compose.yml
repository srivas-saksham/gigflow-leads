version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    env_file:
      - ./frontend/.env

volumes:
  mongo-data: